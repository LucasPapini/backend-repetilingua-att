version: '3.8'

services:
  backend:
    build: .
    container_name: backend-repetilingua
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CLIENT_ID: myclientid
      CLIENT_SECRET: myclientsecret
      JWT_DURATION: 86400
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped